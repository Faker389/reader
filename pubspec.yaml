name: apka
description: "Fovea — a focused RSVP reading app. One word at a time, at your speed."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  google_sign_in: ^7.2.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Import
  file_picker: ^11.0.3
  archive: ^4.3.0
  xml: ^6.5.0
  csv: ^6.0.0
  http: ^1.5.0

  # Platform
  wakelock_plus: ^1.4.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

  # Utilities
  google_fonts: ^6.3.2
  uuid: ^4.6.0
  intl: ^0.20.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/books/
